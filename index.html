<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <!-- 自己託管的 Noto Sans/Serif TC，切成 unicode-range 分片，
         由 scripts/fetch-fonts.mjs 產生。瀏覽器只會抓它需要的那幾片。 -->
    <link rel="stylesheet" href="/fonts.css" />
    <title>未寄</title>
    <script>
      // 在第一次繪製前決定主題，避免深色模式使用者看到淺色閃一下。
      // 這段與 src/store/theme.ts 的 THEME_KEY 必須一致。
      try {
        var saved = localStorage.getItem('weiji.theme')
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved)
        }
      } catch (e) {
        /* 無痕模式等取不到 localStorage：交給 prefers-color-scheme */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
